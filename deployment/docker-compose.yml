version: '3.9'

services:
  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: secureauth-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-secureauth}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-secureauth_pass}
      MONGO_INITDB_DATABASE: secureauth-x
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - secureauth-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../deployment/Dockerfile
    container_name: secureauth-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_USERNAME:-secureauth}:${MONGO_PASSWORD:-secureauth_pass}@mongodb:27017/secureauth-x?authSource=admin
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_this_in_production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_this_in_production}
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 7d
      COOKIE_SECRET: ${COOKIE_SECRET:-change_this_in_production}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:80}
      MFA_APP_NAME: SecureAuthX
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@secureauth-x.com}
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - secureauth-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Frontend (Nginx) ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: secureauth-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - secureauth-network
    volumes:
      - ./deployment/nginx.conf:/etc/nginx/nginx.conf:ro

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  mongodb_data:
    driver: local

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  secureauth-network:
    driver: bridge
